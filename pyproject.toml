[project]
name = "notification-hub"
version = "0.1.0"
description = "Notification Hub — multi-channel (email / SMS / webhook) notification service with an agentic AI layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    # smart-llm provides the agentic LLM layer, key store, usage/budgets,
    # observability + service-runtime rails. Pinned to a public commit; bump
    # the ref to pull upstream fixes (see docs/USER_GUIDE.md "Updating smart-llm").
    "smart-llm[db,observability] @ git+https://github.com/centeba/smart-llm@ad295adca2fb44f0a49e91883942f1778bb2d789",
    # Cap below 0.137.0: that release introduced an `_IncludedRouter` route
    # object that lacks `.path`, which crashes route matching here (the
    # smart-llm router factory's included sub-routers) → 500 on every endpoint.
    # 0.136.x is the known-good line (matches mit-stack's pin).
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn[standard]>=0.45.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "redis[hiredis]>=7.4.0",
    "httpx>=0.28.1",
    "temporalio>=1.26.0",
    "cryptography>=46.0.7",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pyjwt>=2.12.1",
    "slowapi>=0.1.9",
    "structlog>=25.0.0",
    "sentry-sdk[fastapi]>=2.58.0",
    "python-multipart>=0.0.26",
    "jsonschema>=4.23.0",
    "tenacity>=9.0.0",
    "emails>=0.6",
    "jinja2>=3.1.0",
    "twilio>=9.0.0",
    "aiobotocore>=2.13.0",
    "openpyxl>=3.1.0",
    "playwright>=1.46.0",
    "stripe>=10.0.0",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "pandas>=2.2.0",
    "mcp>=1.27,<2",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
]
lint = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
integration-hub = "integration_hub_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/integration_hub_backend"]
# Explicitly include the bundled i18n JSON files so they are present in
# installed wheels and Docker images (hatchling includes all non-.py files
# inside the package tree by default, but this makes the intent explicit).
include = ["src/integration_hub_backend/i18n/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Blocking gate: bug-catching pyflakes/pycodestyle + cleaned style families
# (matches the CI "critical" select). The full ruleset (S*, B904, E402, E501,
# the rest of UP) is still surfaced by CI's advisory `ruff check .` step but is
# non-blocking — several are false positives (S608 on parameterized SQL, etc.).
select = [
    "E9", "F5", "F63", "F7", "F811", "F401", "I",
    "UP015", "UP017", "UP028", "UP035", "UP041",
    "RUF010", "RUF022", "E401", "W",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI markers are meant to be called in argument defaults (framework
# contract, not the B008 mutable-default bug). B008 still catches real ones.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
exclude = ['(^|/)tests/', '(^|/)alembic/', '(^|/)migrations/']

[[tool.mypy.overrides]]
module = [
    "smart_llm.*",
    "temporalio.*",
    "slowapi.*",
    "sentry_sdk.*",
    "twilio.*",
    "aiobotocore.*",
    "jsonschema.*",
    "sqlparse.*",
    "playwright.*",
    "openpyxl.*",
    "google.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "stripe.*",
    "mcp.*",
    "pandas.*",
    # sb_core is the optional SentinelBuild chassis (guarded imports); absent standalone.
    "sb_core.*",
]
ignore_missing_imports = true

# `emails` ships source but no py.typed and does not re-export its public
# `Message` symbol, so following it trips strict no-implicit-reexport. Skip
# following it and treat it as untyped.
[[tool.mypy.overrides]]
module = ["emails", "emails.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Coverage gate (SB-04) — conservative floor (lower bound of measured local coverage); ratchet up from the first green CI run. Override a partial local run with -o addopts="" or --no-cov.
addopts = "--cov=integration_hub_backend --cov-report=term-missing --cov-fail-under=30"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
