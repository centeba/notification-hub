services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notification_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nhub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── Temporal (auto-setup, Postgres-backed) ──────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: nhub-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notification_hub}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:5175
      # JWT signing secret for User-Master-issued tokens. SECRET_KEY validates
      # the primary (CurrentUser) surface; SHARED_SECRET_KEY the JWT-admin
      # (SBUser) surface — they must match. Override both via a .env for real
      # deployments; the default below is a dev-only placeholder.
      - SECRET_KEY=${SECRET_KEY:-dev-notification-hub-secret-change-me}
      - SHARED_SECRET_KEY=${SHARED_SECRET_KEY:-${SECRET_KEY:-dev-notification-hub-secret-change-me}}
    ports:
      - "8001:8001"
    command: ["integration-hub", "start-api"]

  # ── Temporal Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhub-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notification_hub}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      - SECRET_KEY=${SECRET_KEY:-dev-notification-hub-secret-change-me}
      - SHARED_SECRET_KEY=${SHARED_SECRET_KEY:-${SECRET_KEY:-dev-notification-hub-secret-change-me}}
    command: ["integration-hub", "start-worker"]

  # ── Admin UIs (nginx-served production builds; each proxies /api → api) ───────
  # For local dev with hot-reload instead:
  #   react-admin:     cd react-admin && npm install && npm run dev
  #   flutter example: cd flutter_package/example && flutter run -d chrome
  react-admin:
    build:
      context: ./react-admin
      dockerfile: Dockerfile
    container_name: nhub-react-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5175:80"

  flutter-web:
    build:
      context: ./flutter_package
      dockerfile: Dockerfile
    container_name: nhub-flutter-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
