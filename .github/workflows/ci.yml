name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Blocking ruff rules (bug-catching + cleaned style families). The full
  # ruleset runs advisory below — several rules are false positives here
  # (S608 on parameterized SQL, etc.).
  CRIT_SELECT: "E9,F5,F63,F7,F811,F401,I,UP015,UP017,UP028,UP035,UP041,RUF010,RUF022,E401,W"

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff: the format gate must be reproducible (the formatter changes
      # between releases). Bump deliberately and re-run `ruff format`.
      - run: pip install "ruff==0.15.10"
      - name: Bug-catching + cleaned style (BLOCKING)
        run: ruff check . --no-cache --select "$CRIT_SELECT"
      - name: Formatting (BLOCKING)
        if: always()
        run: ruff format --check .
      - name: Full ruleset (advisory)
        if: always()
        continue-on-error: true
        run: ruff check . --no-cache

  mypy:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pulls smart-llm from git)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install mypy
      - name: mypy strict
        run: mypy src

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test deps (pulls smart-llm from git)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Migrate DB
        run: python -m alembic upgrade head
      - name: pytest
        run: python -m pytest -q --tb=short

  flutter:
    name: flutter (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_package
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  web:
    name: react-admin (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
