name: notification_hub_ui
description: Notification Hub - Multi-channel notification management UI package
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.1.0

  # HTTP
  dio: ^5.9.2

  # Storage
  flutter_secure_storage: ^10.0.0

  # UI
  google_fonts: ^8.0.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
