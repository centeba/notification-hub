name: notification_hub_ui
description: Notification Hub - Multi-channel notification management platform
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Routing
  go_router: ^17.1.0

  # HTTP
  dio: ^5.9.2

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.0

  # UI
  google_fonts: ^8.0.2
  fl_chart: ^0.69.0
  flutter_quill: ^10.8.0
  intl: ^0.20.2
  timeago: ^3.7.0
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3
  custom_lint: ^0.7.5
  riverpod_lint: ^4.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
