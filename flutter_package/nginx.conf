server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend (service name "api" in docker-compose).
    location /api/ {
        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Don't let browsers pin the app shell / compiled bundle: a redeploy must
    # be picked up on the next load. (Hashed assets under assets/ stay cacheable.)
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback — Flutter web handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
