# Analyzer configuration for notification_hub_ui.
#
# `deprecated_member_use` flags Flutter SDK members that newer SDKs deprecate
# (e.g. Color.withOpacity -> .withValues, Radio.groupValue/onChanged -> a
# RadioGroup ancestor, FormField.value -> .initialValue). These are
# forward-compatibility notices tied to the installed SDK version, not defects,
# so they are non-fatal here and tracked for a dedicated migration. Real
# problems — errors, warnings, and every other lint — still fail
# `flutter analyze`.
analyzer:
  errors:
    deprecated_member_use: ignore
